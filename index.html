<!doctype html><html lang="en"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover"><style>html{color-scheme:light;-webkit-text-size-adjust:100%}body{margin:0}img{max-width:100%}</style><title>Stir Crazy</title>
<meta name="claude:viewport-fit-sides" content="cover">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Barlow:wght@400;500;600&family=Big+Shoulders+Display:wght@700;800&display=swap" rel="stylesheet">
<style>
/* Layout: slim header, sticky bar (search, base spirit row, optional filter drawer, count), then a grid of plain drink tiles.
   Tap a tile for the recipe sheet. Each base spirit has its own colour. */
:root{
  --bg:#EDF1F6; --surface:#FFFFFF; --ink:#0D1B2E; --muted:#5A6A7E; --line:#D2DBE6;
  --tile:#F4F7FA; --tile-hover:#E6EDF5; --focus:#1F6FEB; --scrim:rgba(13,27,46,.55); --heart:#C2304A;
  --whiskey:#7A3F0B; --whiskey-acc:#F0B35A; --whiskey-num:#8A4B0F;
  --rum:#5E2616; --rum-acc:#F2A07B; --rum-num:#9A3A1C;
  --gin:#0B4A43; --gin-acc:#7FD3C3; --gin-num:#0B6A5E;
  --vodka:#1F2C47; --vodka-acc:#A9BEE8; --vodka-num:#2F4A86;
  --tequila:#1B5429; --tequila-acc:#A8E08C; --tequila-num:#2C7A3F;
  --brandy:#55193A; --brandy-acc:#F0A8C8; --brandy-num:#8E2A5E;
  --other:#9A3410; --other-acc:#FFB38A; --other-num:#B4410F;
  --na:#4B3380; --na-acc:#CDB8F5; --na-num:#5B3FA0;
  --display:'Big Shoulders Display','Arial Narrow',Impact,sans-serif;
  --body:'Barlow',system-ui,-apple-system,'Segoe UI',Roboto,sans-serif;
}
@media (prefers-color-scheme: dark){
  :root:not([data-theme="light"]){
    --bg:#0A1119; --surface:#121C29; --ink:#E7EDF5; --muted:#93A4B9; --line:#243448;
    --tile:#192637; --tile-hover:#213249; --focus:#6AA5FF; --scrim:rgba(0,0,0,.65); --heart:#FF7A90;
    --whiskey:#4A2606; --whiskey-num:#F0B35A; --rum:#3A170D; --rum-num:#F2A07B; --gin:#06302B; --gin-num:#7FD3C3;
    --vodka:#121B30; --vodka-num:#A9BEE8; --tequila:#0F3318; --tequila-num:#A8E08C; --brandy:#3A0F27; --brandy-num:#F0A8C8;
    --other:#5E1F08; --other-num:#FFB38A; --na:#2E1F4A; --na-num:#CDB8F5;
    color-scheme:dark;
  }
}
:root[data-theme="dark"]{
  --bg:#0A1119; --surface:#121C29; --ink:#E7EDF5; --muted:#93A4B9; --line:#243448;
  --tile:#192637; --tile-hover:#213249; --focus:#6AA5FF; --scrim:rgba(0,0,0,.65); --heart:#FF7A90;
  --whiskey:#4A2606; --whiskey-num:#F0B35A; --rum:#3A170D; --rum-num:#F2A07B; --gin:#06302B; --gin-num:#7FD3C3;
  --vodka:#121B30; --vodka-num:#A9BEE8; --tequila:#0F3318; --tequila-num:#A8E08C; --brandy:#3A0F27; --brandy-num:#F0A8C8;
  --other:#5E1F08; --other-num:#FFB38A; --na:#2E1F4A; --na-num:#CDB8F5;
  color-scheme:dark;
}
*{box-sizing:border-box}
[hidden]{display:none!important}
body{background:var(--bg);color:var(--ink);font-family:var(--body);font-size:15px;line-height:1.35;
  padding-block:16px 36px;padding-left:max(16px,env(safe-area-inset-left,0px));padding-right:max(16px,env(safe-area-inset-right,0px))}
body::before{content:"";position:fixed;inset:0 0 auto;height:env(safe-area-inset-top,0px);z-index:10;background:var(--bg)}
button{font:inherit;color:inherit}
[data-b]{--team-bg:#1D2733;--team-acc:#9FB3C8;--num:var(--ink)}
[data-b="Whiskey"]{--team-bg:var(--whiskey);--team-acc:var(--whiskey-acc);--num:var(--whiskey-num)}
[data-b="Rum"]{--team-bg:var(--rum);--team-acc:var(--rum-acc);--num:var(--rum-num)}
[data-b="Gin"]{--team-bg:var(--gin);--team-acc:var(--gin-acc);--num:var(--gin-num)}
[data-b="Vodka"]{--team-bg:var(--vodka);--team-acc:var(--vodka-acc);--num:var(--vodka-num)}
[data-b="Tequila"]{--team-bg:var(--tequila);--team-acc:var(--tequila-acc);--num:var(--tequila-num)}
[data-b="Brandy"]{--team-bg:var(--brandy);--team-acc:var(--brandy-acc);--num:var(--brandy-num)}
[data-b="Liqueur & wine"]{--team-bg:var(--other);--team-acc:var(--other-acc);--num:var(--other-num)}
[data-b="Non-alcoholic"]{--team-bg:var(--na);--team-acc:var(--na-acc);--num:var(--na-num)}

.app{max-width:1120px;margin:0 auto;display:grid;gap:12px}
.hd{display:flex;flex-wrap:wrap;align-items:baseline;gap:4px 14px}
h1{margin:0;font-family:var(--display);font-weight:800;font-size:clamp(32px,7vw,48px);line-height:.95;text-transform:uppercase;letter-spacing:.01em}
.meta{color:var(--muted);font-size:14px}

.top{position:sticky;top:env(safe-area-inset-top,0px);z-index:6;background:var(--bg);display:grid;gap:8px;padding-block:8px;border-bottom:1px solid var(--line)}
.srow{display:flex;gap:8px}
.srch{flex:1;min-width:0;font:inherit;font-size:15px;padding:9px 12px;border:1px solid var(--line);border-radius:8px;background:var(--surface);color:var(--ink)}
.srch:focus-visible,.chip:focus-visible,.btn:focus-visible,.x:focus-visible,.step-b:focus-visible,.open:focus-visible,.fav:focus-visible{outline:2px solid var(--focus);outline-offset:2px}
.chips{display:flex;flex-wrap:wrap;gap:6px}
.chips.scroll{flex-wrap:nowrap;overflow-x:auto;scrollbar-width:none;padding-bottom:2px}
.chips.scroll::-webkit-scrollbar{display:none}
.chip{flex:0 0 auto;border:1px solid var(--line);background:var(--surface);border-radius:999px;padding:6px 13px;font-weight:600;font-size:14px;cursor:pointer;white-space:nowrap}
.chip:hover{background:var(--tile-hover)}
.chip[aria-pressed="true"]{background:var(--ink);color:var(--bg);border-color:var(--ink)}
.adv{display:grid;gap:12px;padding:12px;background:var(--surface);border:1px solid var(--line);border-radius:10px;max-height:45vh;overflow-y:auto}
.grp{display:grid;gap:6px;min-width:0}
.grp-l{font-size:12px;font-weight:600;letter-spacing:.09em;text-transform:uppercase;color:var(--muted)}
.adv .chip{background:var(--tile)}
.adv .chip[aria-pressed="true"]{background:var(--ink)}
.bar{display:flex;flex-wrap:wrap;gap:8px;align-items:center;justify-content:space-between}
.count{font-family:var(--display);font-weight:800;font-size:22px;text-transform:uppercase;letter-spacing:.02em;min-width:0}
.count span{font-family:var(--body);font-weight:500;font-size:13px;letter-spacing:0;text-transform:none;color:var(--muted);margin-left:6px}
.btns{display:flex;gap:6px;flex-wrap:wrap}
.btn{border:1px solid var(--line);background:var(--surface);border-radius:8px;padding:8px 13px;font-weight:600;font-size:14px;cursor:pointer;white-space:nowrap}
.btn:hover{background:var(--tile-hover)}
.btn.pri{background:var(--ink);color:var(--bg);border-color:var(--ink)}
.btn[aria-expanded="true"]{background:var(--tile-hover)}

.grid{display:grid;gap:10px;grid-template-columns:repeat(3,minmax(0,1fr))}
@media (max-width:899px){.grid{grid-template-columns:repeat(2,minmax(0,1fr))}}
@media (max-width:560px){.grid{grid-template-columns:minmax(0,1fr)}}
.tile{position:relative;min-width:0;background:var(--surface);border:1px solid var(--line);border-left:6px solid var(--team-bg);border-radius:8px}
.tile:hover{background:var(--tile-hover)}
.open{display:grid;gap:2px;width:100%;text-align:left;cursor:pointer;background:none;border:0;border-radius:8px;padding:10px 52px 11px 12px;min-height:84px}
.t-slot{font-size:11px;font-weight:600;letter-spacing:.08em;text-transform:uppercase;color:var(--num)}
.t-name{font-family:var(--display);font-weight:800;font-size:26px;line-height:1;text-transform:uppercase;overflow-wrap:anywhere}
.t-sub{margin-top:3px;font-size:13px;color:var(--muted)}
.fav{position:absolute;top:4px;right:4px;width:38px;height:38px;border:0;background:none;border-radius:8px;font-size:20px;line-height:1;cursor:pointer;color:var(--muted)}
.fav[aria-pressed="true"]{color:var(--heart)}
.empty{grid-column:1/-1;background:var(--surface);border:1px dashed var(--line);border-radius:10px;padding:28px 16px;text-align:center;color:var(--muted)}

.ov{position:fixed;inset:0;z-index:20;background:var(--scrim);display:flex;align-items:flex-start;justify-content:center;overflow-y:auto;
  padding-block:max(16px,env(safe-area-inset-top,0px)) max(16px,env(safe-area-inset-bottom,0px));padding-left:max(12px,env(safe-area-inset-left,0px));padding-right:max(12px,env(safe-area-inset-right,0px))}
.sheet{width:100%;max-width:560px;background:var(--surface);border:1px solid var(--line);border-radius:12px;overflow:hidden;margin:auto 0}
.band{background:var(--team-bg);color:#fff;padding:14px 16px;display:flex;justify-content:space-between;align-items:flex-end;gap:12px}
.band h2{margin:0;font-family:var(--display);font-weight:800;font-size:38px;line-height:.95;text-transform:uppercase;overflow-wrap:anywhere}
.band .sub{margin-top:5px;font-size:12px;font-weight:600;letter-spacing:.09em;text-transform:uppercase;color:var(--team-acc)}
.band-r{display:grid;gap:8px;justify-items:end}
.band-b{display:flex;gap:6px}
.x{background:rgba(255,255,255,.16);border:0;border-radius:6px;color:#fff;width:34px;height:34px;font-size:20px;line-height:1;cursor:pointer}
.x[aria-pressed="true"]{color:#FF9DAE}
.band .rec{font-family:var(--display);font-weight:700;font-size:22px;line-height:1;text-align:right}
.band .rec span{display:block;margin-top:3px;font-family:var(--body);font-weight:600;font-size:11px;letter-spacing:.09em;text-transform:uppercase;color:var(--team-acc)}
.sb{padding:14px;display:grid;gap:16px}
.sec{display:grid;gap:8px}
.sec-t{display:flex;flex-wrap:wrap;gap:8px;align-items:center;justify-content:space-between}
.sec-h{font-size:12px;font-weight:600;letter-spacing:.09em;text-transform:uppercase;color:var(--muted)}
.mini{display:flex;gap:6px;align-items:center}
.seg{display:inline-flex;border:1px solid var(--line);border-radius:8px;overflow:hidden}
.seg button{border:0;background:var(--surface);padding:5px 10px;font-weight:600;font-size:13px;cursor:pointer}
.seg button[aria-pressed="true"]{background:var(--ink);color:var(--bg)}
.seg button:focus-visible{outline:2px solid var(--focus);outline-offset:-2px}
.srv{display:inline-flex;align-items:center;border:1px solid var(--line);border-radius:8px;overflow:hidden}
.step-b{border:0;background:var(--surface);width:30px;height:30px;font-size:17px;cursor:pointer}
.srv output{min-width:46px;text-align:center;font-weight:600;font-variant-numeric:tabular-nums;font-size:13px}
.ings{margin:0;padding:0;list-style:none;border:1px solid var(--line);border-radius:8px}
.ings li{display:grid;grid-template-columns:106px minmax(0,1fr);gap:10px;padding:8px 10px;border-top:1px solid var(--line)}
.ings li:first-child{border-top:0}
.ings b{font-family:var(--display);font-weight:800;font-size:19px;line-height:1.1;color:var(--num);font-variant-numeric:tabular-nums}
.ings span{align-self:center;overflow-wrap:anywhere}
.steps{margin:0;padding:0;list-style:none;display:grid;gap:8px;counter-reset:s}
.steps li{counter-increment:s;display:grid;grid-template-columns:26px minmax(0,1fr);gap:10px}
.steps li::before{content:counter(s);font-family:var(--display);font-weight:800;font-size:18px;color:var(--num);line-height:1.2}
.seg.tg{display:grid;grid-template-columns:repeat(3,minmax(0,1fr))}
.seg.tg button{padding:8px 10px;font-size:14px}
.ing-b{font:inherit;color:inherit;background:none;border:0;border-bottom:1px dotted var(--muted);padding:0;text-align:left;cursor:pointer}
.ing-b:hover,.ing-b[aria-expanded="true"]{color:var(--num);border-bottom-color:var(--num)}
.ing-b:focus-visible,.ing-find:focus-visible{outline:2px solid var(--focus);outline-offset:2px}
.ing-d{grid-column:1/-1;background:var(--tile);border-radius:8px;padding:10px 12px;display:grid;gap:6px;font-size:14px}
.ing-d p{margin:0}
.ing-t{font-family:var(--display);font-weight:800;font-size:19px;text-transform:uppercase;color:var(--num)}
.ing-s{padding-left:14px;position:relative;color:var(--muted)}
.ing-s::before{content:"-";position:absolute;left:3px}
.ing-find{justify-self:start;margin-top:4px}
.pq{width:64px;font-family:var(--display);font-weight:800;font-size:19px;line-height:1.1;color:var(--num);background:var(--surface);border:1px solid var(--line);border-radius:6px;padding:2px 6px;text-align:right;font-variant-numeric:tabular-nums;-moz-appearance:textfield}
.pq::-webkit-outer-spin-button,.pq::-webkit-inner-spin-button{-webkit-appearance:none;margin:0}
.pq:focus-visible,.opt input:focus-visible{outline:2px solid var(--focus);outline-offset:1px}
.pstep{display:inline-flex;gap:4px;margin-left:8px;vertical-align:middle}
.pstep button{width:32px;height:32px;border:1px solid var(--line);background:var(--surface);border-radius:6px;font-size:18px;line-height:1;cursor:pointer}
.pstep button:hover{background:var(--tile-hover)}
.pstep button:focus-visible{outline:2px solid var(--focus);outline-offset:1px}
.pqu{font-family:var(--display);font-weight:800;font-size:19px;color:var(--num);margin-left:4px}
.sc{margin-left:6px;color:var(--num);font-weight:600;letter-spacing:0;text-transform:none;font-size:13px}
.opt{display:inline-flex;gap:6px;align-items:center;margin-left:8px;font-size:13px;color:var(--muted);cursor:pointer;white-space:nowrap}
.ings li.off b,.ings li.off .ing-b{text-decoration:line-through;opacity:.45}
.foot{display:grid;gap:4px;font-size:14px;color:var(--muted);border-top:1px solid var(--line);padding-top:12px}
.foot b{font-weight:600;color:var(--ink)}
.gls{display:block;overflow:visible}
.gls .gb{fill:var(--bg);fill-opacity:.55}
.gls .go{fill:none;stroke:var(--muted);stroke-width:2.6;stroke-linecap:round;stroke-linejoin:round}
.gls .ice{fill:#fff;fill-opacity:.38;stroke:#fff;stroke-opacity:.6;stroke-width:1}
.open .gls{position:absolute;right:8px;bottom:8px;pointer-events:none}
.art{display:flex;justify-content:center;padding:6px 0 2px;background:var(--bg);border-radius:8px}
.verbar{display:flex;justify-content:space-between;align-items:center;font-size:12px;color:var(--muted)}
.linkbtn{font:inherit;font-size:12px;color:var(--muted);background:none;border:0;padding:4px 0;text-decoration:underline;cursor:pointer}
.panel{background:var(--surface);border:1px solid var(--line);border-radius:8px;padding:16px}
.notes h3{font-family:var(--display);font-weight:800;font-size:18px;letter-spacing:.06em;text-transform:uppercase;margin:0 0 6px}
.notes h4{margin:12px 0 2px;font-family:var(--display);font-weight:800;font-size:16px;letter-spacing:.04em}
.notes ul{margin:2px 0 0;padding-left:18px;color:var(--ink);font-size:14px}
.rq{display:grid;gap:4px;margin:10px 0}
.rq label{font-size:12px;font-weight:600;letter-spacing:.06em;text-transform:uppercase;color:var(--muted)}
.rq input,.rq textarea{font:inherit;color:var(--ink);background:var(--bg);border:1px solid var(--line);border-radius:8px;padding:10px;width:100%}
.credit{margin:28px 0 12px;padding:0 0 6px;text-align:center;color:var(--muted)}
.credit .cr-rule{height:3px;border-radius:3px;background:linear-gradient(90deg,var(--whiskey-num),var(--gin-num));opacity:.85;margin:0 auto 18px;max-width:320px}
.credit .cr-mark{display:inline-flex;align-items:center;justify-content:center;width:46px;height:46px;border-radius:50%;border:2px solid var(--line);background:var(--surface);font-family:var(--display);font-weight:800;font-size:19px;letter-spacing:.04em;color:var(--ink);box-shadow:0 0 0 4px var(--bg),0 0 0 5px var(--line)}
.credit .cr-by{margin-top:12px;font-size:11px;letter-spacing:.28em;text-transform:uppercase}
.credit .cr-name{margin-top:2px;font-family:var(--display);font-weight:800;font-size:30px;line-height:1.1;letter-spacing:.07em;text-transform:uppercase;color:var(--ink)}
.credit .cr-date{margin-top:6px;display:flex;align-items:center;justify-content:center;gap:10px;font-size:12px;letter-spacing:.22em;text-transform:uppercase}
.credit .cr-date:before,.credit .cr-date:after{content:"";width:34px;height:1px;background:var(--line)}
</style></head><body>

<div class="app">
  <div class="verbar"><span id="vtxt"></span><span><button type="button" id="reqbtn" class="linkbtn" aria-expanded="false">Request a drink</button> <button type="button" id="relbtn" class="linkbtn" aria-expanded="false">Release notes</button></span></div>
  <section id="req" class="panel notes" hidden>
    <h3>Request a drink</h3>
    <p class="meta">Tell me what to add. This opens an email to me with your request filled in. Press send in your email app to finish.</p>
    <div class="rq"><label for="rq-n">Drink name</label><input id="rq-n" type="text" autocomplete="off"></div>
    <div class="rq"><label for="rq-r">Recipe or notes (optional)</label><textarea id="rq-r" rows="3"></textarea></div>
    <div class="rq"><label for="rq-w">Your name (optional)</label><input id="rq-w" type="text" autocomplete="name"></div>
    <button type="button" class="btn pri" id="rq-s">Send request</button>
  </section>
  <section id="notes" class="panel notes" hidden></section>
  <header class="hd">
    <h1>Stir Crazy</h1>
    <div class="meta" id="meta"></div>
  </header>

  <section class="top" aria-label="Find a drink">
    <div class="srow">
      <input class="srch" id="q" type="search" placeholder="Search a drink or ingredient" aria-label="Search a drink or ingredient" autocomplete="off">
      <button class="btn" id="fbtn" type="button" aria-expanded="false" aria-controls="adv">Filters<span id="fn"></span></button>
    </div>
    <div class="chips scroll" id="f-b" role="group" aria-label="Base spirit"></div>
    <div class="seg tg" id="f-tg" role="group" aria-label="Sweet or sour"><button type="button" data-tg="Sweet" aria-pressed="false">Sweet</button><button type="button" data-tg="" aria-pressed="true">Any</button><button type="button" data-tg="Sour" aria-pressed="false">Sour</button></div>
    <div class="adv" id="adv" hidden>
      <div class="grp"><div class="grp-l" id="l-t">Taste</div><div class="chips" id="f-t" role="group" aria-labelledby="l-t"></div></div>
      <div class="grp"><div class="grp-l" id="l-s">Style</div><div class="chips" id="f-s" role="group" aria-labelledby="l-s"></div></div>
      <div class="grp"><div class="grp-l" id="l-d">Difficulty</div><div class="chips" id="f-d" role="group" aria-labelledby="l-d"></div></div>
      <div class="grp"><div class="grp-l" id="l-sf">Sugar</div><div class="chips" id="f-sf" role="group" aria-labelledby="l-sf"></div></div>
    </div>
    <div class="bar">
      <div class="count" id="count" aria-live="polite"></div>
      <div class="btns">
        <button class="btn" id="reset" type="button">Reset</button>
        <button class="btn pri" id="rand" type="button">Surprise me</button>
      </div>
    </div>
  </section>

  <section class="grid" id="grid" aria-label="Matching drinks"></section>

  <footer class="credit" aria-label="Credit">
    <div class="cr-rule"></div>
    <div class="cr-mark">JS</div>
    <div class="cr-by">Designed and built by</div>
    <div class="cr-name">Jameson Spence</div>
    <div class="cr-date">October 2026</div>
  </footer>
</div>

<div class="ov" id="ov" hidden>
  <div class="sheet" id="sheet" role="dialog" aria-modal="true" aria-labelledby="sh-name"></div>
</div>

<script>
/* ing: [name, qty, unit]  unit: oz (default) | dash | pc | top.  tx: [sweet, sour, bitter] 0-3.  m: stir | shake | build | blend.  long: tall drink */
var D=[
{n:"Old Fashioned",b:"Whiskey",d:1,min:3,g:"Rocks",m:"stir",long:0,tx:[2,0,2],ing:[["Bourbon or rye",2],["Simple syrup",0.25],["Angostura bitters",2,"dash"]],st:["Add the syrup and bitters to a rocks glass.","Add the whiskey and one large ice cube.","Stir for about 20 seconds.","Squeeze an orange peel over the glass and drop it in."],gar:"Orange peel"},

function tastes(x){var t=[];if(x.tx[0]>=2)t.push("Sweet");if(x.tx[1]>=2)t.push("Sour");if(x.tx[2]>=2)t.push("Bitter");if(x.sv)t.push("Savory");if(x.m==="stir"&&x.b!=="Non-alcoholic")t.push("Spirit-forward");return t}

/* Sugar-free = no added sugar. sf 1: as written. sf 2: only syrups or mixers that have a zero-sugar version. sf 0: has liqueur, sweet juice, etc. */
var SWAP=/syrup|honey|sugar|agave|maple|demerara|tonic|cola|ginger ale|ginger beer|lemonade|limeade|lemon-lime soda|grapefruit soda/;
var SUG=/liqueur|cointreau|triple sec|curacao|amaretto|campari|aperol|amaro|sweet vermouth|chartreuse|maraschino|benedictine|drambuie|galliano|schnapps|irish cream|creme de|cream of coconut|coconut rum|grenadine|orgeat|juice|puree|cider|port\b|lillet|pimm|limoncello|heering|frozen|mango|banana/;
function sugarClass(x){
  var sw=[];
  for(var i=0;i<x.ing.length;i++){
    var n=x.ing[i][0].toLowerCase();
    if(SWAP.test(n)){sw.push(n);continue}
    if(/lime juice|lemon juice|tomato juice/.test(n))continue;
    if(SUG.test(n))return {sf:0,sw:[]};
  }
  return {sf:sw.length?2:1,sw:sw};
}

function matches(x){
  if(F.b==="__fav"){if(!isFav(x))return false}
  else if(F.b&&x.b!==F.b)return false;
  if(F.t&&x.tags.indexOf(F.t)<0)return false;
  if(F.d&&x.d!==+F.d)return false;
  if(F.sf&&!x.sf)return false;
  if(F.k&&x.keys.indexOf(F.k)<0)return false;
  if(F.s){
    if(F.s==="Spirit-forward"){if(x.tags.indexOf(F.s)<0)return false}
    else if(glassType(x)!==F.s)return false;
  }
  if(F.q){
    var hay=(x.n+" "+x.b+" "+x.ing.map(function(i){return i[0]}).join(" ")).toLowerCase();
    if(hay.indexOf(F.q)<0)return false;
  }
  return true;
}
function syncChips(){
  document.querySelectorAll(".chip").forEach(function(c){
    c.setAttribute("aria-pressed",String(String(F[c.dataset.k]||"")===c.dataset.v));
  });
  document.querySelectorAll("[data-tg]").forEach(function(b){b.setAttribute("aria-pressed",String(F.t===b.dataset.tg))});
  var fc=document.querySelector('[data-v="__fav"]');
  if(fc)fc.innerHTML="&#9829; Saved"+(fav.length?" ("+fav.length+")":"");
}
var res=[];
function render(){
  res=D.filter(matches);
  syncChips();
  var act=[];
  if(F.t)act.push(F.t);
  if(F.s)act.push(F.s==="Short"||F.s==="Long"?F.s+" drink":F.s);
  if(F.d)act.push(DIFF[F.d]);
  if(F.sf)act.push("Sugar-free");
  if(F.k)act.push("with "+INFO[F.k][0].toLowerCase());
  var nf=act.length-((F.t==="Sweet"||F.t==="Sour")?1:0)-(F.k?1:0);
  $("fn").textContent=nf>0?" ("+nf+")":"";
  $("count").innerHTML=res.length+(res.length===1?" drink":" drinks")+'<span>'+(act.length?act.join(", "):"of "+D.length)+'</span>';
  var h="";
  res.forEach(function(x){
    var i=D.indexOf(x),f=isFav(x);
    h+='<div class="tile" data-b="'+x.b+'"><button class="open" type="button" data-i="'+i+'">'
      +'<span class="t-slot">'+x.b+'</span><span class="t-name">'+x.n+'</span>'
      +'<span class="t-sub">'+DIFF[x.d]+' | '+x.min+' min | '+x.g+'</span>'+glassSVG(x,38)+'</button>'
      +'<button class="fav" type="button" data-i="'+i+'" aria-pressed="'+f+'" aria-label="Save '+x.n+'">'+(f?"&#9829;":"&#9825;")+'</button></div>';
  });
  if(!res.length){
    h='<div class="empty">'+(F.b==="__fav"&&!fav.length&&!act.length&&!F.q?"No saved drinks yet. Tap the heart on any drink to keep it here.":"No drink matches all of those. Try clearing a filter.")+(F.q?' <button type="button" class="linkbtn" data-req="'+F.q.replace(/[&<>"]/g,"")+'">Request "'+F.q.replace(/[&<>"]/g,"")+'"</button>':"")+'</div>';
  }
  $("grid").innerHTML=h;
}
$("meta").textContent=D.length+" recipes";

$("fbtn").addEventListener("click",function(){
  var open=$("adv").hidden;
  $("adv").hidden=!open;
  this.setAttribute("aria-expanded",String(open));
});
document.querySelector(".top").addEventListener("click",function(e){
  var c=e.target.closest(".chip");if(!c)return;
  var k=c.dataset.k,v=c.dataset.v;
  F[k]=(k==="d"&&v)?+v:v;
  render();
});
$("f-tg").addEventListener("click",function(e){var b=e.target.closest("[data-tg]");if(!b)return;var v=b.dataset.tg;F.t=(F.t===v)?"":v;render()});
$("q").addEventListener("input",function(){F.q=this.value.trim().toLowerCase();render()});
$("reset").addEventListener("click",function(){F={b:"",t:"",d:0,s:"",q:"",sf:"",k:""};$("q").value="";render()});
$("rand").addEventListener("click",function(){
  if(!res.length)return;
  openSheet(D.indexOf(res[Math.floor(Math.random()*res.length)]),$("rand"));
});
$("grid").addEventListener("click",function(e){
  var f=e.target.closest(".fav");
  if(f){
    var x=D[+f.dataset.i];toggleFav(x);
    if(F.b==="__fav"){render();return}
    var on=isFav(x);
    f.setAttribute("aria-pressed",String(on));f.innerHTML=on?"&#9829;":"&#9825;";syncChips();
    return;
  }
  var t=e.target.closest(".open");if(t)openSheet(+t.dataset.i,t);
});

  var ask="Add this drink to my Stir Crazy cocktail picker. Get the current index.html yourself from my GitHub repo jamesonespence/Stir-crazy (do not ask me for the file). Match the format of the other recipes, bump the version and release notes, test it at phone size, and commit it straight to the main branch if you have GitHub write access. Then give me the live site link (https://jamesonespence.github.io/Stir-crazy/), and if you could not commit, give me the index.html file and the upload link (https://github.com/jamesonespence/Stir-crazy/upload/main). Drink: "+n+"."+(r?" Notes: "+r+".":"")+(w?" Requested by "+w+".":"");
  var body="Drink: "+n+"\n"+(r?"Recipe or notes: "+r+"\n":"")+(w?"From: "+w+"\n":"")+"\nBuild it in Claude (opens a new chat with the request filled in):\nhttps://claude.ai/new?q="+encodeURIComponent(ask)+"\n\nSent from Stir Crazy";
  location.href="mailto:"+REQUEST_EMAIL+"?subject="+encodeURIComponent("Stir Crazy drink request: "+n)+"&body="+encodeURIComponent(body);
});
$("grid").addEventListener("click",function(e){var b=e.target.closest("[data-req]");if(b)reqOpen(b.getAttribute("data-req"))});
$("relbtn").addEventListener("click",function(){var o=$("notes").hidden;$("notes").hidden=!o;this.setAttribute("aria-expanded",o)});
function frac(x){
  var r=Math.round(x*8)/8,w=Math.floor(r),f=r-w;
  var m={0:"",0.125:"1/8",0.25:"1/4",0.375:"3/8",0.5:"1/2",0.625:"5/8",0.75:"3/4",0.875:"7/8"};
  var s=m[f];
  if(!w)return s||"0";
  return s?w+" "+s:String(w);
}
function qty(i){
  var q=i[1],u=i[2]||"oz";
  if(u==="top")return "Top up";
  var a=q*serv;
  if(u==="oz")return unit==="oz"?frac(a)+" oz":(Math.round(a*30/5)*5)+" ml";
  if(u==="dash")return frac(a)+(a===1?" dash":" dashes");
  if(u==="pinch")return frac(a)+(a===1?" pinch":" pinches");
  return frac(a);
}
function tasteLine(x){
  var names=["sweet","sour","bitter"],p=[];
  x.tx.forEach(function(v,k){if(v>0)p.push([v,names[k]])});
  p.sort(function(a,b){return b[0]-a[0]});
  if(x.sv)p.unshift([2,"savory"]);
  if(!p.length)return "dry";
  return p.map(function(a){return a[0]>=3?"very "+a[1]:a[0]===2?a[1]:"a touch of "+a[1]}).join(", ");
}
var SPIRIT=/tequila|mezcal|vodka|\bgin\b|bourbon|rye|whiskey|scotch|\brum\b|rhum|cachaca|cognac|brandy|pisco|applejack|campari|aperol|prosecco|champagne|sparkling wine|wine|sherry|vermouth|\bport\b|pimm|lillet|amaretto|irish cream|limoncello|stout/;
function primaryIdx(x){
  var best=-1,n,m=-1;
  if(x.b==="Non-alcoholic"){x.ing.forEach(function(i,k){if((i[2]||"oz")==="oz"&&i[1]>m){m=i[1];best=k}});return best}
  for(n=0;n<x.ing.length;n++)if((x.ing[n][2]||"oz")==="oz"&&SPIRIT.test(x.ing[n][0].toLowerCase()))return n;
  for(n=0;n<x.ing.length;n++)if((x.ing[n][2]||"oz")==="oz")return n;
  return -1;
}
function fmtNum(v){return unit==="oz"?String(parseFloat(v.toFixed(2))):String(Math.round(v))}
function fmtScale(v){return String(parseFloat(v.toFixed(2)))}
var optOff={};
function updateQty(){
  cur.ing.forEach(function(i,n){var el=$("q"+n);if(el)el.textContent=qty(i)});
  var sc=$("scv");if(sc)sc.textContent=fmtScale(serv)+"x";
  document.querySelectorAll("[data-sc]").forEach(function(b){b.setAttribute("aria-pressed",String(+b.dataset.sc===serv))});
}
function ingDetail(k){
  var inf=INFO[k],c=keyCount[k]||1;
  return '<div class="ing-d"><div class="ing-t">'+inf[0]+'</div><p>'+inf[1]+'</p><div class="sec-h">Substitutes</div>'
    +inf[2].map(function(t){return '<div class="ing-s">'+t+'</div>'}).join("")
    +'<button class="btn ing-find" type="button" data-k="'+k+'">Find '+c+(c===1?' drink':' drinks')+' with this</button></div>';
}
function sheetHtml(x){
  var f=isFav(x);
  var h='<div class="band" data-b="'+x.b+'"><div><h2 id="sh-name">'+x.n+'</h2><div class="sub">'+x.b+' | '+x.g+' | '+METHOD[x.m]+'</div></div>'
   +'<div class="band-r"><div class="band-b"><button class="x" id="sfav" type="button" aria-pressed="'+f+'" aria-label="Save this drink">'+(f?"&#9829;":"&#9825;")+'</button><button class="x" id="close" type="button" aria-label="Close recipe">&times;</button></div>'
   +'<div class="rec">'+DIFF[x.d]+'<span>'+x.min+' min</span></div></div></div>';
  h+='<div class="sb" data-b="'+x.b+'"><div class="art">'+glassSVG(x,120)+'</div>';
  h+='<div class="sec"><div class="sec-t"><div class="sec-h">Ingredients<span class="sc" id="scv">'+fmtScale(serv)+'x</span></div><div class="mini">'
   +'<div class="seg" role="group" aria-label="Scale"><button type="button" id="sc1" data-sc="1" aria-pressed="'+(serv===1)+'">1x</button><button type="button" id="sc2" data-sc="2" aria-pressed="'+(serv===2)+'">2x</button><button type="button" id="sc4" data-sc="4" aria-pressed="'+(serv===4)+'">4x</button></div>'
   +'<div class="seg" role="group" aria-label="Units"><button type="button" data-u="oz" aria-pressed="'+(unit==="oz")+'">oz</button><button type="button" data-u="ml" aria-pressed="'+(unit==="ml")+'">ml</button></div></div></div>';
  h+='<ul class="ings">';
  var pi=primaryIdx(x);
  x.ing.forEach(function(i,n){
    var k=infoKey(i[0]),inf=k?INFO[k]:null,open=!!inf&&openIng===n;
    var nm=inf?'<button class="ing-b" id="ib'+n+'" type="button" data-n="'+n+'" aria-expanded="'+open+'">'+i[0]+'</button>':i[0];
    var q;
    if(n===pi){q='<input class="pq" id="pq" type="number" inputmode="decimal" step="any" min="0" value="'+fmtNum(i[1]*(unit==="oz"?1:30)*serv)+'" aria-label="Amount of '+i[0]+'"><span class="pqu">'+unit+'</span>'}
    else q='<b id="q'+n+'">'+qty(i)+'</b>';
    var op=i[3]===1?'<label class="opt"><input type="checkbox" id="o'+n+'" data-n="'+n+'"'+(optOff[n]?'':' checked')+'> Include (optional)</label>':'';
    h+='<li'+(optOff[n]?' class="off"':'')+'>'+(n===pi?'<div>'+q+'</div>':q)+'<span>'+nm+op+(n===pi?'<span class="pstep"><button type="button" id="pm" aria-label="Decrease amount">-</button><button type="button" id="pp" aria-label="Increase amount">+</button></span>':'')+'</span>'+(open?ingDetail(k):'')+'</li>';
  });
  h+='</ul></div>';
  h+='<div class="sec"><div class="sec-h">Method</div><ol class="steps">';
  x.st.forEach(function(s){h+='<li><span>'+s+'</span></li>'});
  h+='</ol></div>';
  var sg=x.sf===1?'<div><b>Sugar:</b> none added</div>':x.sf===2?'<div><b>Sugar-free swap:</b> use a zero-sugar version of '+x.sw.join(", ")+'.</div>':'';
  h+='<div class="foot"><div><b>Garnish:</b> '+x.gar+'</div><div><b>Taste:</b> '+tasteLine(x)+'</div>'+sg+'</div></div>';
  return h;
}
function paint(focusId){
  $("sheet").innerHTML=sheetHtml(cur);
  var el=$(focusId||"close");if(el)el.focus();
}
function openSheet(i,from){
  cur=D[i];lastTile=from;serv=1;openIng=-1;optOff={};
  $("ov").hidden=false;document.body.style.overflow="hidden";
  paint();
}
function closeSheet(){
  $("ov").hidden=true;document.body.style.overflow="";
  if(lastTile&&document.body.contains(lastTile))lastTile.focus();
}
$("ov").addEventListener("click",function(e){
  if(e.target===$("ov")||e.target.closest("#close")){closeSheet();return}
  var b,fid=null;
  if((b=e.target.closest("#pp,#pm"))){
    var pi2=primaryIdx(cur),bs=cur.ing[pi2][1]*(unit==="oz"?1:30),st=unit==="oz"?0.5:15;
    var nv=Math.max(st,Math.round((bs*serv+(b.id==="pp"?st:-st))*100)/100);
    serv=Math.min(nv/bs,50);$("pq").value=fmtNum(bs*serv);updateQty();return;
  }
  if((b=e.target.closest("[data-sc]"))){serv=+b.dataset.sc;fid="sc"+b.dataset.sc}
  else if((b=e.target.closest(".opt input"))){var on=+b.dataset.n;optOff[on]=!b.checked;fid="o"+on}
  else if((b=e.target.closest("[data-u]"))){unit=b.dataset.u;try{localStorage.setItem("cp-unit",unit)}catch(err){}}
  else if(e.target.closest("#sfav")){toggleFav(cur);fid="sfav";render()}
  else if((b=e.target.closest(".ing-b"))){var n=+b.dataset.n;openIng=(openIng===n)?-1:n;fid="ib"+n}
  else if((b=e.target.closest(".ing-find"))){F.k=b.dataset.k;F.q="";$("q").value="";closeSheet();render();window.scrollTo(0,0);return}
  else return;
  paint(fid||"close");
});
$("ov").addEventListener("input",function(e){
  if(e.target.id!=="pq")return;
  var v=parseFloat(e.target.value),pi=primaryIdx(cur);
  if(!(v>0)||!isFinite(v)||pi<0)return;
  serv=Math.min(v/(cur.ing[pi][1]*(unit==="oz"?1:30)),50);
  updateQty();
});
$("ov").addEventListener("change",function(e){
  if(e.target.id!=="pq")return;
  var pi=primaryIdx(cur);
  e.target.value=fmtNum(cur.ing[pi][1]*(unit==="oz"?1:30)*serv);
});
document.addEventListener("keydown",function(e){if(e.key==="Escape"&&!$("ov").hidden)closeSheet()});
render();
</script>
</body></html>
